[project]
name = "phlop"
version = "0.1.1"

dependencies = [ "dill", "pyyaml" ]

description = "stuff and things"
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.optional-dependencies]
# killing a stalled job's descendants (mpi ranks), cpu use in stall detection
psutil = [ "psutil" ]

[project.urls]
"Homepage" = "https://github.com/PhilipDeegan/phlop/"
"Bug Tracker" = "https://github.com/PhilipDeegan/phlop/issues"

[build-system]
requires = [ "setuptools>=62", "wheel", "packaging" ]
