
name: Build on Ubuntu

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  pull_request:

env:
  CURL_GET: curl -fL --retry 3 --retry-delay 2
  PATH_GET: https://github.com/mkn/mkn/releases/latest/download

jobs:
  build:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        python-version: ['3.12', '3.13', '3.14']

    steps:
    - uses: actions/checkout@v6
      with:
        submodules: true

    - run: |
        $CURL_GET -o mkn $PATH_GET/mkn_nix
        chmod +x mkn
        ./mkn clean build test run -p scope_timer,threaded_scope_timer,scope,threaded_scope -Oa "-fPIC -std=c++20" -W 9

    - uses: actions/setup-python@v6
      if: ${{ !cancelled() }} # the python tests don't need mkn
      with:
        python-version: ${{ matrix.python-version }}
        architecture: x64

    - if: ${{ !cancelled() }} # mkn failing still fails the job
      run: |
        sudo apt-get install -yq valgrind || echo "no valgrind, its tests are skipped"
        python3 -m pip install -r requirements.txt
        ./sh/lint.sh
        export PATH="$PWD:$PATH"
        ./sh/test.sh
